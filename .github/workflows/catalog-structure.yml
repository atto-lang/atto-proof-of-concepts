name: Catalog and Java-tip grammar hygiene (not compiler CI)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source commit (never PR merge ref)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fail closed unless the exact requested commit was checked out
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD)"
          test "${#EXPECTED_SOURCE_SHA}" -eq 40
          test "$actual" = "$EXPECTED_SOURCE_SHA" || { echo "::error::source SHA mismatch"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "::error::dirty checkout"; exit 1; }
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'Verified source commit: %s\nVerified source tree: %s\n' "$actual" "$tree"
      - name: Java guest evidence preflight self-tests (synthetic local Git only)
        run: python3 -m unittest discover -s src/validation -p 'test_java_guest_gate.py' -v
      - name: Exact Git subtree admission self-tests (local fixture only)
        run: python3 -m unittest discover -s src/validation -p 'test_verify_source_tree.py' -v
      - name: Pinned AttoLang tip fixture source identities (not compilation)
        run: python3 -m unittest discover -s src/validation/atto-tip -p 'test_atto_tip_fixtures.py' -v
      - name: Structural catalog counts
        run: python3 src/validation/check_catalog.py
      - name: Catalog integrity adversarial self-tests (Python only)
        run: python3 -m unittest discover -s src/validation -p 'test_check_catalog.py' -v
      - name: Library PoC inventory (structure only)
        run: python3 src/libraries/check_prototypes.py --list
      - name: Six project reference-oracle scenarios (Python only)
        run: python3 src/projects/check_scenarios.py
      - name: Library catalog harness regression tests (Python only)
        run: python3 -m unittest discover -s src/libraries -p 'test_check_prototypes.py' -v
      - name: Independent JS project reference check (Node, not native)
        run: node src/projects/check_scenarios.mjs
      - name: Project reference-oracle regression tests (Python only)
        run: python3 -m unittest discover -s src/projects -p 'test_check_scenarios.py' -v
      - name: Source/oracle inventory
        run: python3 src/patterns/run_examples.py --list
      - name: Pinned Java grammar source hygiene
        run: python3 src/patterns/tip_syntax_hygiene.py
      - name: Pattern runner contract self-tests
        run: python3 -m unittest discover -s src/patterns -p 'test_run_examples.py' -v
      - name: Syntax hygiene self-tests
        run: python3 -m unittest discover -s src/patterns -p 'test_tip_syntax_hygiene.py' -v
      - name: LLVM smoke-harness contract tests (mocked compiler plus synthetic Clang)
        run: python3 -m unittest discover -s src/validation/llvm-scalar -p 'test_run_native.py' -v
      - name: Scope boundary
        run: echo "Hygiene and structure only; this job runs Python harness tests and synthetic Clang only; no real Oreslang compiler is built or verified."
