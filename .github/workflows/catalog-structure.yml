name: Catalog and Java-tip grammar hygiene (not compiler CI)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural catalog counts
        run: python3 src/validation/check_catalog.py
      - name: Source/oracle inventory
        run: python3 src/patterns/run_examples.py --list
      - name: Pinned Java grammar source hygiene
        run: python3 src/patterns/tip_syntax_hygiene.py
      - name: Pattern runner contract self-tests
        run: python3 -m unittest discover -s src/patterns -p 'test_run_examples.py' -v
      - name: Syntax hygiene self-tests
        run: python3 -m unittest discover -s src/patterns -p 'test_tip_syntax_hygiene.py' -v
      - name: LLVM smoke-harness contract tests (mocked compiler plus synthetic Clang)
        run: python3 -m unittest discover -s src/validation/llvm-scalar -p 'test_run_native.py' -v
      - name: Scope boundary
        run: echo "Hygiene and structure only; this job runs Python harness tests and synthetic Clang only; no real Oreslang compiler is built or verified."
