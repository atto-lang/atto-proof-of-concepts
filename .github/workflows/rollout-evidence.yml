name: Rollout receipt checker self-tests
on:
  pull_request:
    paths:
      - 'tools/rollout-evidence/**'
      - '.github/workflows/rollout-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-checker-self-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head rather than merge ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact checkout and record committed source tree
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::expected SHA is not full lowercase hex"; exit 1; }
          actual="$(git rev-parse --verify HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA" || { echo "::error::head SHA mismatch"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all)" || { echo "::error::dirty checkout"; exit 1; }
          tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$tree" =~ ^[a-f0-9]{40}$ ]] || exit 1
          printf 'SOURCE_HEAD_VERIFIED sha=%s tree=%s\\n' "$actual" "$tree"
      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --manifest-path tools/rollout-evidence/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path tools/rollout-evidence/Cargo.toml --offline --locked --all-targets -- -D warnings
      - name: Receipt inspector unit tests (not guest execution)
        run: cargo test --manifest-path tools/rollout-evidence/Cargo.toml --offline --locked
      - name: Acceptance profile CLI
        run: cargo run --manifest-path tools/rollout-evidence/Cargo.toml --offline --locked -- --cases
