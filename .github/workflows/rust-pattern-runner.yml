name: Rust PoC pattern runner self-tests (NOT Oreslang guest CI)
on:
  pull_request:
    paths:
      - 'tools/pattern-runner/**'
      - '.github/workflows/rust-pattern-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pattern-runner-host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR source head (no merge refs)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Record and verify exact source SHA/tree
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$tree" =~ ^[a-f0-9]{40}$ ]]
          printf 'HOST_ONLY_EXACT_SOURCE sha=%s tree=%s run=%s attempt=%s\n' \
            "$EXPECTED_SHA" "$tree" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version
      - name: Format check
        run: cargo fmt --manifest-path tools/pattern-runner/Cargo.toml --all -- --check
      - name: Clippy host code (no Oreslang guest)
        run: cargo clippy --manifest-path tools/pattern-runner/Cargo.toml --offline --locked --all-targets -- -D warnings
      - name: Bounded runner, SHA-256 and adversarial contract tests
        run: cargo test --manifest-path tools/pattern-runner/Cargo.toml --offline --locked -- --nocapture
      - name: Inventory only, no backend execution
        run: cargo run --manifest-path tools/pattern-runner/Cargo.toml --offline --locked -- --root . --list
      - name: Evidence boundary
        run: |
          echo 'HOST_ONLY: no Java/GraalVM, LLVM, native compiler or Oreslang guest executed.'
